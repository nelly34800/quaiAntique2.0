          </tr>
          <tr>
            <td><strong>Salade de chèvre chaud</strong></td>

          <tr>

            <td>9€</td>
          </tr>
          <tr>

  <div class="text-center p-4">
    <a href="/reserve" class="btn btn-primary">Réserver</a>
