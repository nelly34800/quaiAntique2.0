<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <h1>Mon compte</h1>
  </div>
</div>
<div class="container p-4">
  <form>
    <div class="mb-3">
      <label for="lastName" class="form-label">Nom</label>
      <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Votre nom" />
      <div class="invalid-feedback">
        Le nom est requis
      </div>
    </div>
    <div class="mb-3">
      <label for="firstName" class="form-label">Prénom</label>
      <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Votre prénom"/>
      <div class="invalid-feedback">
        Le prénom est requis
      </div>
    </div>
    <div class="mb-3">
      <label for="allergie" class="form-label">Allergie</label>
      <input type="text" class="form-control" id="allergie" name="allergie" placeholder="Vos allergies (fruit de mer, arachides...)"/>
    </div>
    <div class="mb-3">
      <label for="nbConvives" class="form-label">Nombre de convives habituel</label>
      <input type="number" class="form-control" id="nbConvives" name="nbConvives" placeholder="Combien vous êtes habituellement ?"/>
    </div>
    <div class="text-center">
      <button type="button" class="btn btn-primary mt-3" id="validation-modification" >Modifier vos informations</button>
      <button type="button" class="btn btn-danger mt-3">Supprimer mon compte</button>
    </div>
    <div class="text-center pt-3 pb-5">
      <a href="editPassword"> Cliquer ici pour modifier votre mot de passe </a>
    </div>
  </form>
</div>
