<div class="container p-4">
  <h1 class="text-center">Ajouter une catégorie</h1>
  <form>
    <div class="mb-3">
      <label for="title" class="form-label">Nom de la catégorie</label>
      <input type="text" class="form-control" id="title" name="title" placeholder="ex : entrée"/>
      <div class="invalid-feedback">
        Le nom de la catégorie est requis
      </div>
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-primary" id="validationCategory" disabled>Valider</button>
        <a href="/categories" class="btn btn-dark">Retour</a>
      </div>
  </form>
</div>
